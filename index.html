```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guddu's Night</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&family=Patrick+Hand&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  font-family:'Poppins',sans-serif;
  background:#06101d;
}

.scene{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
  radial-gradient(circle at top,#17365c 0%,#08101c 45%,#02060c 100%);
}

/* STARS */

.stars{
  position:absolute;
  inset:0;
}

.star{
  position:absolute;
  background:white;
  border-radius:50%;
  opacity:.7;
  animation:twinkle infinite ease-in-out;
}

@keyframes twinkle{
  0%,100%{opacity:.2;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.2)}
}

/* MOON */

.moon{
  position:absolute;
  top:70px;
  right:90px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:#fff8d7;
  box-shadow:0 0 80px rgba(255,248,210,.7);
}

/* CLOUDS */

.cloud{
  position:absolute;
  width:260px;
  height:70px;
  background:rgba(255,255,255,.05);
  filter:blur(10px);
  border-radius:100px;
  animation:cloudMove linear infinite;
}

.cloud:nth-child(1){
  top:120px;
  left:-300px;
  animation-duration:40s;
}

.cloud:nth-child(2){
  top:220px;
  left:-350px;
  animation-duration:60s;
}

@keyframes cloudMove{
  from{transform:translateX(0)}
  to{transform:translateX(160vw)}
}

/* CLOCK */

.clock-box{
  position:absolute;
  top:40px;
  left:40px;
  width:130px;
  height:130px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.4);
  backdrop-filter:blur(8px);
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  z-index:30;
}

.clock{
  font-size:28px;
  font-weight:300;
  letter-spacing:2px;
}

/* GROUND */

.ground{
  position:absolute;
  bottom:0;
  width:100%;
  height:230px;
  background:linear-gradient(to top,#091017,#11202e);
}

/* HOUSE */

.house{
  position:absolute;
  bottom:120px;
  left:50%;
  transform:translateX(-50%);
  width:460px;
  height:260px;
  transition:3s;
}

.house-body{
  position:absolute;
  bottom:0;
  width:100%;
  height:180px;
  background:#1d2430;
  border-radius:12px;
  box-shadow:0 0 40px rgba(0,0,0,.4);
}

.roof{
  position:absolute;
  top:0;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:230px solid transparent;
  border-right:230px solid transparent;
  border-bottom:110px solid #2a3240;
}

/* WINDOW */

.window{
  position:absolute;
  top:55px;
  left:50%;
  transform:translateX(-50%);
  width:130px;
  height:100px;
  background:#f6c57a;
  border:7px solid #4a3528;
  border-radius:8px;
  box-shadow:0 0 25px rgba(255,198,122,.6);
}

.window::before{
  content:"";
  position:absolute;
  left:50%;
  top:0;
  transform:translateX(-50%);
  width:5px;
  height:100%;
  background:#4a3528;
}

.window::after{
  content:"";
  position:absolute;
  top:50%;
  left:0;
  transform:translateY(-50%);
  width:100%;
  height:5px;
  background:#4a3528;
}

/* DOOR */

.door{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:95px;
  height:140px;
  border-radius:12px 12px 0 0;
  background:#734d33;
  box-shadow:0 0 25px rgba(255,208,140,.15);
  cursor:pointer;
  transition:1.5s;
  z-index:20;
}

.door::before{
  content:"";
  position:absolute;
  right:15px;
  top:50%;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ffdba5;
}

.door.open{
  transform:translateX(-50%) rotateY(70deg);
  transform-origin:left;
}

/* RABBIT */

.rabbit{
  position:absolute;
  width:90px;
  left:50%;
  bottom:185px;
  transform:translateX(-50%);
  z-index:10;
  transition:3s ease-in-out;
  animation:breath 3s infinite ease-in-out;
}

@keyframes breath{
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(-5px)}
}

.rabbit img{
  width:100%;
  filter:drop-shadow(0 0 15px rgba(255,255,255,.15));
}

.rabbit.runFront{
  left:52%;
  bottom:90px;
  transform:translateX(-50%) scale(2.2);
}

.rabbit.runBack{
  left:50%;
  bottom:80px;
  transform:translateX(-50%) scale(.8);
}

/* MESSAGE */

.message-box{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:90%;
  max-width:650px;
  text-align:center;
  color:white;
  z-index:50;
  opacity:0;
  transition:1s;
}

.message-box.show{
  opacity:1;
}

.message{
  font-size:clamp(1.2rem,2vw,1.8rem);
  line-height:2;
  font-family:'Patrick Hand',cursive;
  text-shadow:0 0 15px rgba(255,255,255,.15);
}

.next-btn{
  margin-top:28px;
  padding:14px 32px;
  border:none;
  border-radius:50px;
  background:rgba(255,255,255,.15);
  color:white;
  backdrop-filter:blur(8px);
  cursor:pointer;
  transition:.4s;
  display:none;
}

.next-btn:hover{
  transform:scale(1.06);
  background:rgba(255,255,255,.25);
}

/* LIGHTS */

.lantern{
  position:absolute;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#ffd690;
  box-shadow:0 0 15px #ffd690;
  animation:flicker 2s infinite;
}

@keyframes flicker{
  0%,100%{opacity:.6}
  50%{opacity:1}
}

/* ZOOM */

.zoom-house{
  animation:zoomInHouse 4s forwards;
}

@keyframes zoomInHouse{
  from{
    transform:translateX(-50%) scale(1);
  }
  to{
    transform:translateX(-50%) scale(2.4);
  }
}

.fade-overlay{
  position:absolute;
  inset:0;
  background:black;
  opacity:0;
  pointer-events:none;
  transition:2s;
  z-index:100;
}

.fade-overlay.show{
  opacity:1;
}

/* MOBILE */

@media(max-width:768px){

  .moon{
    width:90px;
    height:90px;
    right:25px;
  }

  .clock-box{
    width:90px;
    height:90px;
    left:20px;
    top:20px;
  }

  .clock{
    font-size:18px;
  }

  .house{
    width:90%;
  }

  .roof{
    border-left:45vw solid transparent;
    border-right:45vw solid transparent;
  }

  .rabbit{
    width:65px;
  }

}

</style>
</head>
<body>

<div class="scene">

  <div class="stars" id="stars"></div>

  <div class="cloud"></div>
  <div class="cloud"></div>

  <div class="moon"></div>

  <div class="clock-box">
    <div class="clock" id="clock">11:59</div>
  </div>

  <div class="house" id="house">

    <div class="roof"></div>

    <div class="house-body">

      <div class="window"></div>

      <div class="door" id="door"></div>

    </div>

  </div>

  <div class="rabbit" id="rabbit">
    <img src="https://cdn-icons-png.flaticon.com/512/3069/3069172.png">
  </div>

  <div class="ground"></div>

  <div class="message-box" id="messageBox">
    <div class="message" id="message"></div>
    <button class="next-btn" id="nextBtn">Come with me ✨</button>
  </div>

  <div class="fade-overlay" id="fade"></div>

</div>

<script>

/* STARS */

const stars = document.getElementById('stars');

for(let i=0;i<160;i++){

  const star = document.createElement('div');

  star.classList.add('star');

  const size = Math.random()*3 + 1;

  star.style.width = size + 'px';
  star.style.height = size + 'px';

  star.style.left = Math.random()*100 + '%';
  star.style.top = Math.random()*100 + '%';

  star.style.animationDuration = (Math.random()*4 + 2) + 's';

  stars.appendChild(star);
}

/* LANTERNS */

for(let i=0;i<18;i++){

  const lantern = document.createElement('div');

  lantern.classList.add('lantern');

  lantern.style.left = Math.random()*100 + '%';
  lantern.style.bottom = (Math.random()*120 + 20) + 'px';

  document.querySelector('.scene').appendChild(lantern);
}

/* CLOCK */

const clock = document.getElementById('clock');

setTimeout(()=>{
  clock.innerHTML = '12:00';
},2500);

/* RABBIT SEQUENCE */

const rabbit = document.getElementById('rabbit');
const messageBox = document.getElementById('messageBox');
const message = document.getElementById('message');
const nextBtn = document.getElementById('nextBtn');
const house = document.getElementById('house');
const door = document.getElementById('door');
const fade = document.getElementById('fade');

setTimeout(()=>{

  rabbit.classList.add('runFront');

},4500);

setTimeout(()=>{

  messageBox.classList.add('show');

  typeWriter(
`Happy Birthday Guddu.\n\nI'm Chunnu 🐇\n\nSomeone made this because\nyou're really special to them.\n\nCome with me ✨`

  );

},7200);

/* TYPEWRITER */

function typeWriter(text){

  let i = 0;

  function typing(){

    if(i < text.length){

      if(text.charAt(i) === '\n'){
        message.innerHTML += '<br>';
      }
      else{
        message.innerHTML += text.charAt(i);
      }

      i++;

      setTimeout(typing,45);
    }
    else{
      nextBtn.style.display = 'inline-block';
    }
  }

  typing();
}

/* NEXT */

nextBtn.addEventListener('click',()=>{

  messageBox.classList.remove('show');

  rabbit.classList.remove('runFront');
  rabbit.classList.add('runBack');

  setTimeout(()=>{

    house.classList.add('zoom-house');

  },1500);

});

/* DOOR */

let opened = false;

setTimeout(()=>{

  door.addEventListener('click',()=>{

    if(opened) return;

    opened = true;

    door.classList.add('open');

    setTimeout(()=>{

      fade.classList.add('show');

      setTimeout(()=>{

        alert('Inside house scene will continue here ✨');

      },2000);

    },1200);

  });

},12000);

</script>
</body>
</html>
