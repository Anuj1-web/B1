<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>Typing Test Result</title>



<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">



<style>


*{


margin:0;

padding:0;

box-sizing:border-box;

font-family:'Poppins',sans-serif;


}




:root{


--primary:#2563eb;

--dark:#0f172a;

--bg:#eef2f7;

--card:white;

--border:#dbe4ef;

--success:#16a34a;

--danger:#dc2626;

--warning:#f59e0b;

--text:#1e293b;


}






body{


background:var(--bg);

color:var(--text);

min-height:100vh;


}






/* ================= HEADER ================= */



header{


height:75px;


background:linear-gradient(

135deg,

#2563eb,

#0f172a

);


color:white;


display:flex;


align-items:center;


justify-content:space-between;


padding:0 30px;


box-shadow:

0 5px 20px rgba(0,0,0,.2);


}



.logo{


display:flex;


align-items:center;


gap:15px;


}




.logo-icon{


font-size:40px;


}



.logo h1{


font-size:25px;


}



.logo p{


font-size:12px;


opacity:.8;


}





.home-btn{


background:white;


color:#1e3a8a;


padding:10px 18px;


border-radius:8px;


font-weight:600;


cursor:pointer;


border:none;


}








/* ================= MAIN ================= */



.container{


max-width:1400px;


margin:auto;


padding:25px;


}







.card{


background:white;


border-radius:16px;


padding:25px;


border:1px solid var(--border);


box-shadow:

0 8px 25px rgba(0,0,0,.07);


margin-bottom:20px;


}








.card-title{


font-size:20px;


font-weight:700;


margin-bottom:20px;


display:flex;


justify-content:space-between;


align-items:center;


}








/* ================= EXAM INFO ================= */



.exam-info{


display:grid;


grid-template-columns:repeat(4,1fr);


gap:15px;


}




.info-box{


background:#f8fafc;


padding:18px;


border-radius:12px;


text-align:center;


}



.info-box h3{


font-size:24px;


color:var(--primary);


}



.info-box p{


font-size:13px;


color:#64748b;


}








/* ================= RESULT ================= */



.result-grid{


display:grid;


grid-template-columns:repeat(6,1fr);


gap:15px;


}




.result-box{


background:#eff6ff;


padding:18px;


border-radius:12px;


text-align:center;


}




.result-box h2{


font-size:28px;


color:#2563eb;


}



.result-box span{


font-size:12px;


color:#64748b;


}








.marks-box{


background:#dcfce7;


}




.fail-box{


background:#fee2e2;


}








/* ================= COMPARISON ================= */



.compare{


display:grid;


grid-template-columns:1fr 1fr;


gap:20px;


}





.compare-panel{


border:1px solid var(--border);


border-radius:12px;


overflow:hidden;


}




.compare-header{


background:#2563eb;


color:white;


padding:12px;


font-weight:600;


text-align:center;


}





.compare-body{


height:400px;


overflow:auto;


padding:20px;


line-height:2;


font-size:16px;


white-space:pre-wrap;


}





.original{


background:#f8fafc;


}





.typed{


background:#fff;


}









/* ================= BUTTON ================= */



button{


border:none;


cursor:pointer;


transition:.2s;


}



button:hover{


transform:translateY(-2px);


}









/* ================= RESPONSIVE ================= */



@media(max-width:1000px){



.exam-info{


grid-template-columns:repeat(2,1fr);


}



.result-grid{


grid-template-columns:repeat(3,1fr);


}



.compare{


grid-template-columns:1fr;


}



}





</style>


</head>





<body>



<header>


<div class="logo">


<div class="logo-icon">

⌨️

</div>


<div>


<h1>
Typing Result
</h1>


<p>
Examination Performance Report
</p>


</div>


</div>




<button class="home-btn" onclick="goHome()">

Back To Home

</button>



</header>








<div class="container">





<div class="card">


<div class="card-title">

Exam Details

</div>



<div class="exam-info">



<div class="info-box">


<h3 id="examName">

-

</h3>


<p>

Exam

</p>


</div>




<div class="info-box">


<h3 id="title">

-

</h3>


<p>

Passage

</p>


</div>





<div class="info-box">


<h3 id="submitTime">

-

</h3>


<p>

Submitted

</p>


</div>





<div class="info-box">


<h3 id="timeTaken">

-

</h3>


<p>

Time Taken

</p>


</div>



</div>



</div>









<div class="card">


<div class="card-title">

Typing Performance

</div>




<div class="result-grid">



<div class="result-box">


<h2 id="gross">

0

</h2>


<span>

Gross WPM

</span>


</div>





<div class="result-box">


<h2 id="net">

0

</h2>


<span>

Net WPM

</span>


</div>





<div class="result-box">


<h2 id="typedWords">

0

</h2>


<span>

Typed Words

</span>


</div>





<div class="result-box">


<h2 id="correctWords">

0

</h2>


<span>

Correct Words

</span>


</div>





<div class="result-box">


<h2 id="mistakes">

0

</h2>


<span>

Mistakes

</span>


</div>





<div class="result-box marks-box">


<h2 id="marks">

-

</h2>


<span>

Marks

</span>


</div>



</div>



</div>









<div class="card">


<div class="card-title">

Passage Comparison

</div>





<div class="compare">



<div class="compare-panel">


<div class="compare-header">

Original Passage

</div>


<div class="compare-body original" id="original">

</div>


</div>






<div class="compare-panel">


<div class="compare-header">

Candidate Typed Text

</div>


<div class="compare-body typed" id="typed">

</div>


</div>




</div>




</div>






</div>
<script>


/* =====================================
   LOAD RESULT DATA
===================================== */


const resultData =

JSON.parse(

localStorage.getItem("typingResult")

);





if(!resultData){


alert(

"No typing result found."

);


location.href="index.html";


}





const originalText =

resultData.originalText;



const typedText =

resultData.typedText;






const examName =

resultData.exam;






/* =====================================
   DISPLAY BASIC DETAILS
===================================== */



document.getElementById("examName").textContent=

examName;



document.getElementById("title").textContent=

resultData.title;



document.getElementById("submitTime").textContent=

resultData.submittedAt;







document.getElementById("original").textContent=

originalText;



document.getElementById("typed").textContent=

typedText;









/* =====================================
   TIME CALCULATION
===================================== */



const startTime =

localStorage.getItem(

"examStartTime"

);




let timeTaken;



if(startTime){



let start =

new Date(startTime);



let end =

new Date(resultData.submittedAt);



timeTaken =

(end-start)/1000;



}

else{


// fallback

timeTaken=

resultData.duration*60;



}





let minutes =

timeTaken/60;





if(minutes<=0){


minutes=1/60;


}





document.getElementById("timeTaken").textContent=

minutes.toFixed(2)+" min";









/* =====================================
   GROSS WPM
===================================== */



const keystrokes =

typedText.length;





const grossWPM =

(keystrokes/5)/minutes;









/* =====================================
   WORD ANALYSIS
===================================== */



function normalizeWord(word){


return word

.trim()

.toLowerCase()

.replace(/[^\w]/g,"");


}







function calculateMistakes(original,typed){



let originalWords =

original

.trim()

.split(/\s+/);



let typedWords =

typed

.trim()

.split(/\s+/);



let mistakeCount=0;





let max=Math.max(

originalWords.length,

typedWords.length

);






for(let i=0;i<max;i++){



if(

normalizeWord(originalWords[i]||"")
!==

normalizeWord(typedWords[i]||"")

){



mistakeCount++;



}



}




return mistakeCount;



}







const mistakes =

calculateMistakes(

originalText,

typedText

);









const typedWords =

Math.floor(

keystrokes/5

);





const correctWords =

Math.max(

0,

typedWords-mistakes

);









/* =====================================
   DISPLAY BASIC VALUES
===================================== */



document.getElementById("gross").textContent=

grossWPM.toFixed(2);



document.getElementById("typedWords").textContent=

typedWords;



document.getElementById("correctWords").textContent=

correctWords;



document.getElementById("mistakes").textContent=

mistakes;
 

/* =====================================
   EXAM WISE EVALUATION
===================================== */


let netWPM = 0;

let marks = "-";

let resultStatus = "-";





/* =====================================
   DP HCM PATTERN
===================================== */



function calculateDPHCM(){



/*

DP HCM Rules:

5 keystrokes = 1 word


10 mistakes = 1 WPM deduction


Every mistake = full mistake


*/



let penalty =

mistakes / 10;




netWPM =

grossWPM - penalty;





if(netWPM < 0){


netWPM=0;


}





// Marks allocation


if(netWPM < 30){



marks=0;



}



else if(

netWPM>=30 &&

netWPM<35

){



marks=10;



}



else if(

netWPM>=35 &&

netWPM<40

){



marks=15;



}



else if(

netWPM>=40 &&

netWPM<45

){



marks=18;



}



else if(

netWPM>=45 &&

netWPM<50

){



marks=21;



}



else if(

netWPM>=50

){



marks=25;



}





}





/* =====================================
   OTHER EXAM PATTERN
===================================== */



function calculateOtherExam(){



/*

Other examinations:


5 strokes = 1 word


Correct words =

Total typed words - mistakes


Net WPM =

Correct words / time


*/





netWPM =

correctWords / minutes;





if(netWPM<0){



netWPM=0;



}





marks="-";



resultStatus="-";



}










/* =====================================
   SELECT EXAM RULE
===================================== */



if(

examName

.toLowerCase()

.includes("dp hcm")

){



calculateDPHCM();



}

else{



calculateOtherExam();



}









/* =====================================
   SHOW FINAL VALUES
===================================== */


document.getElementById("net").textContent=

netWPM.toFixed(2);



document.getElementById("marks").textContent=

marks;
 

/* =====================================
   PASSAGE COMPARISON ENGINE
===================================== */


function escapeHTML(text){


return text

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;");


}








function createComparison(){



let originalHTML="";

let typedHTML="";





let maxLength=Math.max(

originalText.length,

typedText.length

);





for(let i=0;i<maxLength;i++){



let originalChar=

originalText[i] || "";



let typedChar=

typedText[i] || "";





if(originalChar===typedChar){



originalHTML +=

"<span>"+

escapeHTML(originalChar)

+

"</span>";



typedHTML +=

"<span>"+

escapeHTML(typedChar)

+

"</span>";



}

else{



if(originalChar){



originalHTML +=

"<span style='background:#fecaca;color:#991b1b'>"+

escapeHTML(originalChar)

+

"</span>";



}





if(typedChar){



typedHTML +=

"<span style='background:#fecaca;color:#991b1b'>"+

escapeHTML(typedChar)

+

"</span>";



}



}



}





document.getElementById("original").innerHTML=

originalHTML;



document.getElementById("typed").innerHTML=

typedHTML;



}








createComparison();









/* =====================================
   HOME BUTTON
===================================== */



function goHome(){



if(confirm(

"Return to home page?"

)){



localStorage.removeItem(

"typingDraft"

);



location.href="index.html";



}



}








/* =====================================
   SAVE FINAL RESULT
===================================== */



const finalResult={



exam:examName,


title:resultData.title,


submittedAt:resultData.submittedAt,


timeTaken:minutes.toFixed(2),


grossWPM:grossWPM.toFixed(2),


netWPM:netWPM.toFixed(2),


typedWords:typedWords,


correctWords:correctWords,


mistakes:mistakes,


marks:marks,


status:resultStatus



};






localStorage.setItem(

"finalTypingResult",

JSON.stringify(finalResult)

);





</script>



</body>


</html>
