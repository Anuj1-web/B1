<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Typing Test Result</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}


:root{

    --primary:#2563eb;
    --dark:#0f172a;
    --bg:#eef2f7;
    --border:#dbe4ef;
    --text:#1e293b;

    --wrong:#fecaca;
    --wrong-text:#991b1b;

    --missing:#fef3c7;
    --missing-text:#92400e;

    --extra:#ddd6fe;
    --extra-text:#5b21b6;

}



body{

    background:var(--bg);
    color:var(--text);
    min-height:100vh;

}



/* ================= HEADER ================= */


header{

    height:75px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #0f172a
    );

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 30px;

    box-shadow:
    0 5px 20px rgba(0,0,0,.2);

}



.logo{

    display:flex;
    align-items:center;
    gap:15px;

}



.logo-icon{

    font-size:40px;

}



.logo h1{

    font-size:25px;

}



.logo p{

    font-size:12px;
    opacity:.8;

}



.home-btn{

    background:white;

    color:#1e3a8a;

    padding:10px 18px;

    border-radius:8px;

    font-weight:600;

    cursor:pointer;

    border:none;

}



/* ================= MAIN ================= */


.container{

    max-width:1400px;

    margin:auto;

    padding:25px;

}



.card{

    background:white;

    border-radius:16px;

    padding:25px;

    border:1px solid var(--border);

    box-shadow:
    0 8px 25px rgba(0,0,0,.07);

    margin-bottom:20px;

}



.card-title{

    font-size:20px;

    font-weight:700;

    margin-bottom:20px;

}





/* ================= EXAM INFO ================= */


.exam-info{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:15px;

}



.info-box{

    background:#f8fafc;

    padding:18px;

    border-radius:12px;

    text-align:center;

}



.info-box h3{

    font-size:22px;

    color:var(--primary);

}



.info-box p{

    font-size:13px;

    color:#64748b;

}





/* ================= RESULT ================= */


.result-grid{

    display:grid;

    grid-template-columns:
    repeat(6,1fr);

    gap:15px;

}



.result-box{

    background:#eff6ff;

    padding:18px;

    border-radius:12px;

    text-align:center;

}



.result-box h2{

    font-size:28px;

    color:#2563eb;

}



.result-box span{

    font-size:12px;

    color:#64748b;

}



.marks-box{

    background:#dcfce7;

}




/* ================= COMPARISON ================= */


.compare{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;

}



.compare-panel{

    border:1px solid var(--border);

    border-radius:12px;

    overflow:hidden;

}



.compare-header{

    background:#2563eb;

    color:white;

    padding:12px;

    text-align:center;

    font-weight:600;

}



.compare-body{

    height:450px;
    overflow:auto;
    padding:20px;
    line-height:2;
    font-size:16px;
    white-space:pre-wrap;
    word-spacing:5px;

}



.original{

    background:#f8fafc;

}



.typed{

    background:white;

}




/* ================= HIGHLIGHT COLORS ================= */



.wrong{

    background:var(--wrong);

    color:var(--wrong-text);

    border-radius:3px;

}



.missing{

    background:var(--missing);

    color:var(--missing-text);

    border-radius:3px;

}



.extra{

    background:var(--extra);

    color:var(--extra-text);

    border-radius:3px;

}




/* ================= RESPONSIVE ================= */


@media(max-width:1000px){


.exam-info{

    grid-template-columns:
    repeat(2,1fr);

}



.result-grid{

    grid-template-columns:
    repeat(3,1fr);

}



.compare{

    grid-template-columns:1fr;

}


}

.wrong,
.missing,
.extra{

    padding:2px 3px;

}

</style>

</head>


<body>


<header>


<div class="logo">


<div class="logo-icon">

⌨️

</div>


<div>

<h1>
Typing Result
</h1>


<p>
Examination Performance Report
</p>


</div>


</div>



<button class="home-btn" onclick="goHome()">

Back To Home

</button>



</header>





<div class="container">



<div class="card">


<div class="card-title">

Exam Details

</div>



<div class="exam-info">


<div class="info-box">

<h3 id="examName">
-
</h3>

<p>
Exam
</p>

</div>



<div class="info-box">

<h3 id="title">
-
</h3>

<p>
Passage
</p>

</div>




<div class="info-box">

<h3 id="submitTime">
-
</h3>

<p>
Submitted
</p>

</div>




<div class="info-box">

<h3 id="timeTaken">
-
</h3>

<p>
Time Taken
</p>

</div>



</div>


</div>







<div class="card">


<div class="card-title">

Typing Performance

</div>


<div class="result-grid">



<div class="result-box">

<h2 id="gross">
0
</h2>

<span>
Gross WPM
</span>

</div>




<div class="result-box">

<h2 id="net">
0
</h2>

<span>
Net WPM
</span>

</div>




<div class="result-box">

<h2 id="typedWords">
0
</h2>

<span>
Typed Words
</span>

</div>




<div class="result-box">

<h2 id="correctWords">
0
</h2>

<span>
Correct Words
</span>

</div>




<div class="result-box">

<h2 id="mistakes">
0
</h2>

<span>
Mistakes
</span>

</div>




<div class="result-box marks-box">

<h2 id="marks">
-
</h2>

<span>
Marks
</span>

</div>



</div>


</div>








<div class="card">


<div class="card-title">

Passage Comparison

</div>




<div class="compare">



<div class="compare-panel">


<div class="compare-header">

Original Passage

</div>



<div class="compare-body original" id="original">

</div>


</div>







<div class="compare-panel">


<div class="compare-header">

Candidate Typed Text

</div>



<div class="compare-body typed" id="typed">

</div>


</div>



</div>




</div>





</div>



<script>

/* =====================================
   LOAD RESULT DATA
===================================== */


const resultData = JSON.parse(
    localStorage.getItem("typingResult")
);



if(!resultData){

    alert("No typing result found.");

    location.href="index.html";

}



const originalText = resultData.originalText || "";

const typedText = resultData.typedText || "";

const examName = resultData.exam || "";





/* =====================================
   DISPLAY BASIC DETAILS
===================================== */


document.getElementById("examName").textContent =
examName;


document.getElementById("title").textContent =
resultData.title || "-";


document.getElementById("submitTime").textContent =
resultData.submittedAt || "-";






/* =====================================
   TIME CALCULATION
===================================== */


const startTime =
localStorage.getItem("examStartTime");


let timeTakenSeconds = 0;



if(startTime && resultData.submittedAt){


    const start =
    new Date(startTime);


    const end =
    new Date(resultData.submittedAt);


    timeTakenSeconds =
    (end-start)/1000;


}

else{


    timeTakenSeconds =
    (resultData.duration || 1)*60;


}



timeTakenSeconds =
Math.max(1,timeTakenSeconds);



const minutes =
timeTakenSeconds/60;



document.getElementById("timeTaken").textContent =
minutes.toFixed(2)+" min";







/* =====================================
   TOKENIZER
===================================== */


function tokenize(text){


    return text.match(
        /[\w']+|[.,!?;:"()\-\n]/g
    ) || [];


}




const originalTokens =
tokenize(originalText);



const typedTokens =
tokenize(typedText);







/* =====================================
   NORMALIZER
===================================== */


function normalizeToken(token){


    return token
    .toLowerCase()
    .trim();


}







/* =====================================
   PROFESSIONAL TEXT ALIGNMENT
   USING DYNAMIC PROGRAMMING
===================================== */


function compareText(original,typed){


    let result={


        original:[],
        typed:[],
        mistakes:0,
        correctWords:0,
        typedWords:0


    };



    const a =
    original.map(normalizeToken);



    const b =
    typed.map(normalizeToken);




    const dp =
    Array(a.length+1)
    .fill()
    .map(()=>
        Array(b.length+1).fill(0)
    );





    for(let i=0;i<=a.length;i++)
        dp[i][0]=i;



    for(let j=0;j<=b.length;j++)
        dp[0][j]=j;





    for(let i=1;i<=a.length;i++){


        for(let j=1;j<=b.length;j++){


            if(a[i-1]===b[j-1]){


                dp[i][j]=dp[i-1][j-1];


            }

            else{


                dp[i][j]=Math.min(

                    dp[i-1][j]+1,

                    dp[i][j-1]+1,

                    dp[i-1][j-1]+1

                );


            }


        }


    }






    let i=a.length;

    let j=b.length;



    let originalResult=[];

    let typedResult=[];






    while(i>0 || j>0){



        if(
            i>0 &&
            j>0 &&
            a[i-1]===b[j-1]
        ){



            originalResult.unshift({

                token:original[i-1],

                type:"correct"

            });



            typedResult.unshift({

                token:typed[j-1],

                type:"correct"

            });



            if(/\w/.test(original[i-1])){

                result.correctWords++;

            }



            i--;

            j--;

        }



        else if(

            i>0 &&
            j>0 &&
            dp[i][j]===dp[i-1][j-1]+1

        ){



            originalResult.unshift({

                token:original[i-1],

                type:"wrong"

            });



            typedResult.unshift({

                token:typed[j-1],

                type:"wrong"

            });



            result.mistakes++;


            i--;

            j--;


        }



        else if(

            i>0 &&
            dp[i][j]===dp[i-1][j]+1

        ){



            originalResult.unshift({

                token:original[i-1],

                type:"missing"

            });



            result.mistakes++;


            i--;


        }



        else{



            typedResult.unshift({

                token:typed[j-1],

                type:"extra"

            });



            result.mistakes++;


            j--;


        }



    }




    result.original =
    originalResult;


    result.typed =
    typedResult;



    result.typedWords =
    typed.filter(x=>/\w/.test(x)).length;



    return result;


}





const comparison =
compareText(
    originalTokens,
    typedTokens
);
/* =====================================
   DISPLAY COMPARISON
===================================== */


function escapeHTML(text){


    return text

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;");


}







function renderTokens(tokens){


    let html = "";



    tokens.forEach((item,index)=>{


        let token =
        escapeHTML(item.token);



        let output = token;



        if(item.type==="wrong"){


            output =
            `<span class="wrong">${token}</span>`;


        }



        else if(item.type==="missing"){


            output =
            `<span class="missing">${token}</span>`;


        }



        else if(item.type==="extra"){


            output =
            `<span class="extra">${token}</span>`;


        }






        /*
          Add spacing except punctuation
        */


        if(

            index < tokens.length-1 &&

            !/[.,!?;:"()\-\n]/.test(
                tokens[index+1].token
            )

        ){

            output += " ";

        }




        html += output;



    });




    return html;



}






document.getElementById("original").innerHTML =

renderTokens(
    comparison.original
);






document.getElementById("typed").innerHTML =

renderTokens(
    comparison.typed
);









/* =====================================
   WORD COUNT AND WPM
===================================== */



const keystrokes =
typedText.length;




/*
    Actual typed words
*/


const typedWords =

typedText.trim()

.split(/\s+/)

.filter(Boolean)

.length;








/*
    Gross WPM

    Formula:

    characters / 5 / minutes

*/


const grossWPM =

minutes > 0

?

(keystrokes / 5) / minutes

:

0;









/* =====================================
   COMMON VALUES
===================================== */


const mistakes =
comparison.mistakes;



const correctWords =
comparison.correctWords;







document.getElementById("gross").textContent =

grossWPM.toFixed(2);





document.getElementById("typedWords").textContent =

typedWords;





document.getElementById("correctWords").textContent =

correctWords;





document.getElementById("mistakes").textContent =

mistakes;









/* =====================================
   EXAM EVALUATION
===================================== */


let netWPM = 0;

let marks = "-";

let resultStatus = "-";









/* =====================================
   DP HCM CALCULATION
===================================== */


/*

DP HCM RULES:

5 strokes = 1 word

10 mistakes = 1 WPM deduction

Marks:

Below 30 = 0

30-35 = 10

35-40 = 15

40-45 = 18

45-50 = 21

50+ = 25


*/





function calculateDPHCM(){



    /*
       Completed 10 mistake groups
       only count as penalty
    */


    let penalty =

    Math.floor(
        mistakes / 10
    );





    netWPM =

    grossWPM - penalty;





    if(netWPM < 0){

        netWPM = 0;

    }






    if(netWPM < 30){


        marks = 0;


    }


    else if(netWPM < 35){


        marks = 10;


    }


    else if(netWPM < 40){


        marks = 15;


    }


    else if(netWPM < 45){


        marks = 18;


    }


    else if(netWPM < 50){


        marks = 21;


    }


    else{


        marks = 25;


    }



}









/* =====================================
   OTHER EXAM CALCULATION
===================================== */



function calculateOtherExam(){



    netWPM =

    minutes > 0

    ?

    correctWords / minutes

    :

    0;





    if(netWPM < 0){

        netWPM = 0;

    }




    marks = "-";

    resultStatus = "-";



}









/* =====================================
   SELECT EXAM TYPE
===================================== */



if(

examName

.toLowerCase()

.includes("dp hcm")

){



    calculateDPHCM();



}

else{


    calculateOtherExam();



}









document.getElementById("net").textContent =

netWPM.toFixed(2);





document.getElementById("marks").textContent =

marks;









/* =====================================
   SAVE FINAL RESULT
===================================== */



const finalResult = {


    exam:examName,


    title:resultData.title,


    submittedAt:resultData.submittedAt,



    timeTaken:
    minutes.toFixed(2),



    grossWPM:
    grossWPM.toFixed(2),



    netWPM:
    netWPM.toFixed(2),



    typedWords:
    typedWords,



    correctWords:
    correctWords,



    mistakes:
    mistakes,



    marks:
    marks,



    status:
    resultStatus



};







localStorage.setItem(

    "finalTypingResult",

    JSON.stringify(finalResult)

);









/* =====================================
   HOME BUTTON
===================================== */



function goHome(){



    if(confirm(

        "Return to home page?"

    )){



        localStorage.removeItem(
            "typingDraft"
        );



        location.href =
        "index.html";


    }


}



</script>

</body>

</html>
