<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>Typing Examination</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">



<style>


*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:'Poppins',sans-serif;

}



:root{


--primary:#2563eb;

--dark:#0f172a;

--bg:#eef2f7;

--card:#ffffff;

--border:#dbe4ef;

--text:#1e293b;


}




body{


height:100vh;

overflow:hidden;

background:var(--bg);

color:var(--text);


}





/* ================= HEADER ================= */



header{


height:70px;


background:linear-gradient(

135deg,

#2563eb,

#0f172a

);


color:white;


display:flex;


align-items:center;


justify-content:space-between;


padding:0 25px;


box-shadow:

0 5px 20px rgba(0,0,0,.25);


}





.logo{


display:flex;

align-items:center;

gap:14px;


}



.logo-icon{


font-size:38px;


}




.logo h2{


font-size:23px;


}



.logo p{


font-size:12px;

opacity:.8;


}




.header-right{


display:flex;

align-items:center;

gap:28px;


}



.info{


text-align:center;


}



.info h3{


font-size:24px;


}



.info span{


font-size:11px;

opacity:.8;


}




#timer{


color:#fde047;

letter-spacing:2px;


}




#fullscreenBtn{


background:white;

color:#1e3a8a;

padding:10px 18px;

border:none;

border-radius:8px;

font-weight:600;

cursor:pointer;


}







/* ================= MAIN AREA ================= */



.exam-area{


height:calc(100vh - 140px);


padding:12px;


display:grid;


grid-template-rows:56% 44%;


gap:12px;


}





.panel{


background:white;


border-radius:14px;


border:1px solid var(--border);


display:flex;


flex-direction:column;


overflow:hidden;


box-shadow:

0 5px 18px rgba(0,0,0,.06);


}





.panel-title{


height:46px;


background:#f8fafc;


border-bottom:1px solid var(--border);


display:flex;


align-items:center;


justify-content:space-between;


padding:0 18px;


font-weight:600;


}




.panel-title span:last-child{


font-size:12px;

color:#64748b;


}







/* ================= PASSAGE ================= */



.passage-container{


flex:1;


overflow-y:auto;


padding:20px 25px;


}





#originalText{


font-size:18px;


line-height:2;


white-space:pre-wrap;


word-break:break-word;


color:#334155;


}








/* ================= TYPING AREA ================= */



.typing-container{


flex:1;


}





#typingArea{


width:100%;


height:100%;


border:none;


outline:none;


resize:none;


padding:18px 22px;


font-size:18px;


line-height:2;


color:#111827;


}





#typingArea:focus{


background:#fffdf5;


}







/* ================= FOOTER ================= */



.footer{


height:70px;


background:white;


border-top:1px solid var(--border);


display:flex;


align-items:center;


justify-content:flex-end;


gap:15px;


padding:0 25px;


}




button{


border:none;


cursor:pointer;


font-size:15px;


font-weight:600;


padding:12px 25px;


border-radius:8px;


transition:.2s;


}



button:hover{


transform:translateY(-2px);


}



#resetBtn{


background:#dc2626;

color:white;


}




#submitBtn{


background:#16a34a;

color:white;


}








/* ================= SCROLLBAR ================= */



::-webkit-scrollbar{


width:8px;


}



::-webkit-scrollbar-thumb{


background:#cbd5e1;


border-radius:20px;


}






/* ================= MOBILE ================= */



@media(max-width:900px){


.header-right{


gap:10px;


}



.exam-area{


grid-template-rows:55% 45%;


}



}






</style>

</head>



<body>



<header>


<div class="logo">


<div class="logo-icon">

⌨️

</div>


<div>


<h2>
Typing Examination
</h2>


<p id="examName">

Loading Examination...

</p>


</div>


</div>






<div class="header-right">


<div class="info">


<h3 id="timer">

00:00

</h3>


<span>

TIME REMAINING

</span>


</div>





<div class="info">


<h3 id="candidate">

Candidate

</h3>


<span>

USER

</span>


</div>





<button id="fullscreenBtn">

⛶ Full Screen

</button>





</div>


</header>






<div class="exam-area">





<div class="panel">


<div class="panel-title">


<span>

Question Passage

</span>


<span>

Scroll Manually

</span>


</div>



<div class="passage-container">


<div id="originalText">

Loading Passage...

</div>


</div>



</div>








<div class="panel">


<div class="panel-title">


<span>

Typing Area

</span>


<span>

Begin From Start

</span>


</div>




<div class="typing-container">


<textarea

id="typingArea"

spellcheck="false"

autocomplete="off"

autocorrect="off"

autocapitalize="off"

placeholder="Type passage here..."

></textarea>


</div>


</div>



</div>







<div class="footer">


<button id="resetBtn">

Reset Test

</button>



<button id="submitBtn">

Submit Test

</button>


</div>
<script>


/* =====================================
   LOAD EXAM DATA
===================================== */


const passageData =

JSON.parse(

localStorage.getItem("selectedPassage")

);



const examName =

localStorage.getItem("selectedExam")

||

"Typing Examination";



const duration =

parseInt(

localStorage.getItem("selectedDuration")

)

||

10;






if(!passageData){


alert(

"No passage selected"

);


location.href="index.html";


}





const originalText =

passageData.text;






document.getElementById("examName").textContent =

examName;






document.getElementById("originalText").textContent =

originalText;







/* =====================================
   CLEAN NEW ATTEMPT
===================================== */



const typingArea =

document.getElementById("typingArea");




// Always start blank

typingArea.value="";



// Remove old temporary attempts

localStorage.removeItem(

"typingDraft"

);







/* =====================================
   TIMER
===================================== */


let totalSeconds =

duration * 60;



let timerInterval = null;



let started=false;



let examFinished=false;






document.getElementById("timer").textContent =

String(duration).padStart(2,"0")

+

":00";








function startTimer(){



timerInterval=setInterval(()=>{



if(totalSeconds<=0){



clearInterval(timerInterval);



submitTest();



return;



}




totalSeconds--;





let minutes=

Math.floor(totalSeconds/60);



let seconds=

totalSeconds%60;





document.getElementById("timer").textContent=

String(minutes).padStart(2,"0")

+

":"

+

String(seconds).padStart(2,"0");




},1000);



}









/* =====================================
   START EXAM WHEN TYPING BEGINS
===================================== */


typingArea.addEventListener(

"input",

function(){



if(!started){



started=true;



startTimer();



}



});









/* =====================================
   FULLSCREEN SYSTEM
===================================== */


const fullscreenBtn =

document.getElementById("fullscreenBtn");






fullscreenBtn.addEventListener(

"click",

async function(){



try{



if(!document.fullscreenElement){



await document.documentElement.requestFullscreen();



fullscreenBtn.textContent=

"⛶ Exit Full Screen";



}

else{



await document.exitFullscreen();



fullscreenBtn.textContent=

"⛶ Full Screen";



}




}

catch(error){



alert(

"Fullscreen is not available."

);



}



});








document.addEventListener(

"fullscreenchange",

function(){



if(!document.fullscreenElement){



fullscreenBtn.textContent=

"⛶ Full Screen";



}



}

);









/* =====================================
   KEEP TYPING FOCUS
===================================== */



window.onload=function(){


typingArea.focus();


};





window.onclick=function(){


typingArea.focus();


};









/* =====================================
   BASIC EXAM SECURITY
===================================== */


document.addEventListener(

"contextmenu",

e=>{

e.preventDefault();

}

);




document.addEventListener(

"copy",

e=>{

e.preventDefault();

}

);




document.addEventListener(

"cut",

e=>{

e.preventDefault();

}

);




document.addEventListener(

"paste",

e=>{

e.preventDefault();

}

);






document.addEventListener(

"keydown",

function(e){



if(

e.ctrlKey ||

e.altKey ||

e.metaKey

){


e.preventDefault();


}




if(

e.key==="F12"

){


e.preventDefault();


}



if(

e.key==="Tab"

){


e.preventDefault();


}



});


 

/* =====================================
   SUBMIT EXAM
===================================== */


function submitTest(){


if(examFinished){

return;

}



examFinished=true;



clearInterval(timerInterval);





const result = {



exam:

examName,



title:

passageData.title,



duration:

duration,



originalText:

originalText,



typedText:

typingArea.value,



submittedAt:

new Date().toLocaleString()



};






localStorage.setItem(

"typingResult",

JSON.stringify(result)

);






// Remove any unfinished data

localStorage.removeItem(

"typingDraft"

);






location.href=

"results.html";



}









/* =====================================
   SUBMIT BUTTON
===================================== */


document

.getElementById("submitBtn")

.addEventListener(

"click",

function(){



let confirmSubmit =

confirm(

"Submit your typing examination?"

);





if(confirmSubmit){



submitTest();



}



}

);









/* =====================================
   RESET EXAM
===================================== */


document

.getElementById("resetBtn")

.addEventListener(

"click",

function(){



let reset =

confirm(

"Start this examination again?"

);





if(reset){



clearInterval(timerInterval);





typingArea.value="";





started=false;





totalSeconds=

duration*60;





document.getElementById("timer").textContent=

String(duration).padStart(2,"0")

+

":00";






localStorage.removeItem(

"typingDraft"

);





typingArea.focus();





}



}

);









/* =====================================
   PREVENT ACCIDENTAL EXIT
===================================== */


window.onbeforeunload=function(){



if(

started &&

!examFinished

){



return "Examination is running.";





}



};









/* =====================================
   TAB CHANGE WARNING
===================================== */


document.addEventListener(

"visibilitychange",

function(){



if(

document.hidden &&

started &&

!examFinished

){



alert(

"Please return to the examination window."

);



}



});









/* =====================================
   END EXAM CLEANLY
===================================== */


function endExam(){



examFinished=true;



typingArea.disabled=true;



clearInterval(timerInterval);



}

 

/* =====================================
   FINAL CLEANUP
===================================== */



// Remove temporary typing data

function clearTemporaryData(){


localStorage.removeItem(

"typingDraft"

);


}








// Professional browser title

setInterval(function(){



if(!examFinished){



document.title =

"Typing Examination | "

+

document.getElementById("timer").textContent;



}



},1000);








/* =====================================
   INITIAL READY STATE
===================================== */


typingArea.focus();




// Always fresh typing box

typingArea.value="";




// Remove previous unfinished attempt

clearTemporaryData();







console.log(

"Typing Examination Ready"

);





</script>



</body>


</html>
