<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>Typing Examination</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>


*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:'Poppins',sans-serif;

}



:root{

--primary:#1d4ed8;

--dark:#0f172a;

--bg:#eef2f7;

--card:#ffffff;

--border:#dbe4ef;

--text:#1e293b;

--muted:#64748b;

--success:#16a34a;

--danger:#dc2626;

}



body{

height:100vh;

overflow:hidden;

background:var(--bg);

color:var(--text);

}



/* ================= HEADER ================= */


header{


height:72px;


background:linear-gradient(
135deg,
#2563eb,
#0f172a
);


color:white;


display:flex;


align-items:center;


justify-content:space-between;


padding:0 25px;


box-shadow:
0 5px 18px rgba(0,0,0,.2);


}




.logo{


display:flex;

align-items:center;

gap:15px;


}



.logo-icon{

font-size:40px;

}



.logo h2{

font-size:23px;

}



.logo p{

font-size:12px;

opacity:.8;

}





.exam-info{


display:flex;

align-items:center;

gap:40px;


}



.info-box{

text-align:center;

}



.info-box h3{

font-size:26px;

}



.info-box span{

font-size:11px;

opacity:.8;

}



#timer{

color:#fde047;

letter-spacing:2px;

}





/* ================= MAIN EXAM AREA ================= */


.exam-container{


height:

calc(100vh - 72px - 70px);


display:grid;


grid-template-rows:1fr 1fr;


gap:12px;


padding:12px;


}





.box{


background:white;


border-radius:14px;


border:1px solid var(--border);


display:flex;


flex-direction:column;


overflow:hidden;


box-shadow:

0 5px 15px rgba(0,0,0,.06);


}





.box-header{


height:50px;


background:#f8fafc;


border-bottom:1px solid var(--border);


display:flex;


align-items:center;


justify-content:space-between;


padding:0 20px;


font-weight:600;


}





.box-header small{


color:var(--muted);

font-size:12px;

}





/* ================= PASSAGE ================= */


.passage-wrapper{


flex:1;


overflow:auto;


padding:25px;


}



#originalText{


font-size:19px;


line-height:2;


white-space:pre-wrap;


word-break:break-word;


color:#334155;


}





/* ================= TYPING ================= */


.typing-wrapper{


flex:1;


}



#typingArea{


width:100%;


height:100%;


border:none;


outline:none;


resize:none;


padding:25px;


font-size:19px;


line-height:2;


color:#111827;


background:#fff;


}



#typingArea:focus{


background:#fffdf5;


}






/* ================= FOOTER ================= */



.bottom-bar{


height:70px;


background:white;


border-top:1px solid var(--border);


display:flex;


align-items:center;


justify-content:flex-end;


gap:15px;


padding:0 25px;


}





button{


padding:13px 28px;


border:none;


border-radius:9px;


font-size:15px;


font-weight:600;


cursor:pointer;


transition:.3s;


}



button:hover{


transform:translateY(-2px);


}



#resetBtn{


background:#dc2626;


color:white;


}



#submitBtn{


background:#16a34a;


color:white;


}





/* ================= SCROLL ================= */



::-webkit-scrollbar{


width:8px;


}



::-webkit-scrollbar-thumb{


background:#cbd5e1;


border-radius:20px;


}




/* ================= RESPONSIVE ================= */



@media(max-width:900px){


.exam-info{


gap:15px;


}



.exam-container{


overflow:auto;


height:auto;


}



}



</style>

</head>


<body>



<header>



<div class="logo">


<div class="logo-icon">

⌨️

</div>



<div>

<h2>
Typing Examination
</h2>


<p id="examName">

Loading Examination...

</p>


</div>


</div>





<div class="exam-info">


<div class="info-box">


<h3 id="timer">

00:00

</h3>


<span>

TIME REMAINING

</span>


</div>



<div class="info-box">


<h3 id="candidate">

Candidate

</h3>


<span>

USER

</span>


</div>



</div>


</header>






<div class="exam-container">



<!-- PASSAGE SECTION -->


<div class="box">


<div class="box-header">


<span>
Question Passage
</span>


<small>
Scroll manually
</small>


</div>



<div class="passage-wrapper">


<div id="originalText">

Loading Passage...

</div>


</div>


</div>







<!-- TYPING SECTION -->


<div class="box">


<div class="box-header">


<span>

Typing Area

</span>


<small>

Enter text exactly

</small>


</div>




<div class="typing-wrapper">


<textarea

id="typingArea"

spellcheck="false"

autocomplete="off"

autocorrect="off"

autocapitalize="off"

placeholder="Start typing here..."

></textarea>


</div>


</div>




</div>






<div class="bottom-bar">


<button id="resetBtn">

Reset Test

</button>


<button id="submitBtn">

Submit Test

</button>


</div>
<script>


/* =================================
   LOAD EXAM DATA
================================= */


const passageData =

JSON.parse(

localStorage.getItem("selectedPassage")

);



const examName =

localStorage.getItem("selectedExam")

||

"Typing Examination";



const duration =

parseInt(

localStorage.getItem("selectedDuration")

)

||

10;





if(!passageData){


alert(
"No passage selected."
);


location.href="index.html";


}





const originalText = passageData.text;



document.getElementById("examName").textContent =

examName;




document.getElementById("originalText").textContent =

originalText;





/* =================================
   VARIABLES
================================= */


const typingArea =

document.getElementById("typingArea");



let totalSeconds =

duration * 60;



let timerInterval = null;



let started = false;



let examFinished = false;



let typedText = "";






/* =================================
   TIMER DISPLAY
================================= */


document.getElementById("timer").textContent =

String(duration).padStart(2,"0")
+
":00";







function startTimer(){


timerInterval = setInterval(function(){



if(totalSeconds<=0){


clearInterval(timerInterval);


submitTest();


return;


}




totalSeconds--;




let minutes =

Math.floor(totalSeconds/60);



let seconds =

totalSeconds%60;




document.getElementById("timer").textContent =


String(minutes).padStart(2,"0")
+
":"
+
String(seconds).padStart(2,"0");




},1000);



}









/* =================================
   START TEST ON FIRST INPUT
================================= */


typingArea.addEventListener(

"input",

function(){



if(!started){


started=true;


startTimer();


}



typedText=this.value;



}

);







/* =================================
   KEEP ONLY TYPED TEXT
================================= */


typingArea.addEventListener(

"keydown",

function(e){



if(examFinished){


e.preventDefault();


return;


}



}

);







/* =================================
   RESTORE FOCUS
================================= */


window.onload=function(){


typingArea.focus();


};




window.onclick=function(){


typingArea.focus();


};








/* =================================
   DISABLE COPY PASTE
================================= */


document.addEventListener(

"copy",

e=>{

e.preventDefault();

}

);



document.addEventListener(

"cut",

e=>{

e.preventDefault();

}

);



document.addEventListener(

"paste",

e=>{

e.preventDefault();

}

);







/* =================================
   KEYBOARD SECURITY
================================= */


document.addEventListener(

"keydown",

function(e){



if(

e.ctrlKey ||

e.altKey ||

e.metaKey

){


e.preventDefault();


}



if(e.key==="F12"){


e.preventDefault();


}



if(e.key==="Tab"){


e.preventDefault();


}



}

);








/* =================================
   FULLSCREEN
================================= */


async function startFullscreen(){


try{


await document.documentElement.requestFullscreen();


}

catch(e){}



}



startFullscreen();







/* =================================
   AUTO SAVE TYPING
================================= */


setInterval(function(){



if(started && !examFinished){


localStorage.setItem(

"typingDraft",

typingArea.value

);


}



},2000);







/* =================================
   RESTORE UNSUBMITTED TEXT
================================= */


const oldDraft =

localStorage.getItem(

"typingDraft"

);



if(oldDraft){


typingArea.value = oldDraft;


typedText = oldDraft;


}




 

/* =================================
   SUBMIT TEST
================================= */


function submitTest(){


if(examFinished){

return;

}



examFinished=true;



clearInterval(timerInterval);





const result = {


exam:

examName,



title:

passageData.title,



duration:

duration,



originalText:

originalText,



typedText:

typingArea.value,



submittedAt:

new Date().toLocaleString()



};





localStorage.setItem(

"typingResult",

JSON.stringify(result)

);





// remove temporary typing data

localStorage.removeItem(

"typingDraft"

);





location.href=

"results.html";



}









/* =================================
   SUBMIT BUTTON
================================= */


document

.getElementById("submitBtn")

.addEventListener(

"click",

function(){



let confirmSubmit =

confirm(

"Are you sure you want to submit the examination?"

);



if(confirmSubmit){


submitTest();


}



}

);









/* =================================
   RESET TEST
================================= */


document

.getElementById("resetBtn")

.addEventListener(

"click",

function(){



let reset =

confirm(

"Reset current examination?"

);



if(reset){



clearInterval(timerInterval);



typingArea.value="";



localStorage.removeItem(

"typingDraft"

);



totalSeconds =

duration*60;



started=false;



document.getElementById("timer").textContent =

String(duration).padStart(2,"0")
+
":00";



typingArea.focus();



}



}

);









/* =================================
   PREVENT ACCIDENTAL EXIT
================================= */


window.onbeforeunload=function(e){


if(!examFinished){


return "Your examination is running.";

}


};









/* =================================
   TAB SWITCH WARNING
================================= */


document.addEventListener(

"visibilitychange",

function(){



if(

document.hidden &&

started &&

!examFinished

){



alert(

"Please do not leave the examination window."

);



}



}

);









/* =================================
   STOP EXAM CLEANLY
================================= */


function endExam(){


examFinished=true;


clearInterval(timerInterval);


typingArea.disabled=true;


}

 

/* =================================
   FINAL CLEANUP
================================= */



// Remove focus issues after exam end

function lockExam(){


typingArea.blur();


typingArea.disabled=true;


}





// Clear old data before new test

function clearOldResult(){


localStorage.removeItem(

"typingResult"

);


}





// Keep exam title updated

setInterval(function(){


if(!examFinished){


document.title =

"Typing Examination - "
+
document.getElementById("timer").textContent;


}



},1000);







/* =================================
   INITIAL SETTINGS
================================= */


typingArea.focus();





/* =================================
   COMPLETE
================================= */


</script>



</body>

</html>
