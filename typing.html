<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Typing Examination</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}


:root{

--primary:#2563eb;
--dark:#0f172a;
--success:#16a34a;
--danger:#dc2626;

--bg:#eef2f7;
--card:#ffffff;
--border:#dbe4ef;
--text:#1e293b;
--muted:#64748b;

}


body{

background:var(--bg);
color:var(--text);

height:100vh;
overflow:hidden;

}



/* ================= HEADER ================= */


header{

height:70px;

background:linear-gradient(
135deg,
#2563eb,
#0f172a
);

color:white;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 25px;

box-shadow:0 5px 20px rgba(0,0,0,.2);

}


.logo{

display:flex;
align-items:center;
gap:14px;

}


.logo-icon{

font-size:38px;

}


.logo h2{

font-size:23px;

}


.logo p{

font-size:12px;
opacity:.8;

}



.examInfo{

display:flex;
align-items:center;
gap:35px;

}


.infoBox{

text-align:center;

}


.infoBox h3{

font-size:24px;

}


.infoBox span{

font-size:11px;
opacity:.8;

}



#timer{

color:#fde047;

letter-spacing:2px;

}



/* ================= MAIN AREA ================= */


.main{

height:calc(100vh - 70px - 75px);

padding:12px;

display:grid;

grid-template-rows:1fr 1fr;

gap:12px;

}



/* ================= PANELS ================= */


.panel{

background:white;

border-radius:14px;

border:1px solid var(--border);

display:flex;

flex-direction:column;

overflow:hidden;

box-shadow:0 5px 15px rgba(0,0,0,.05);

}



.panelHeader{

height:48px;

background:#f8fafc;

border-bottom:1px solid var(--border);

display:flex;

align-items:center;

justify-content:space-between;

padding:0 18px;

font-weight:600;

}


.panelHeader span:last-child{

font-size:13px;

color:var(--muted);

}




/* ================= PASSAGE ================= */


.passageArea{

flex:1;

overflow:auto;

padding:20px;

font-size:18px;

line-height:2;

white-space:pre-wrap;

word-break:break-word;

}



#originalText{

color:#334155;

}



/* ================= TYPING AREA ================= */


.typingBox{

flex:1;

position:relative;

}


textarea{

width:100%;

height:100%;

border:none;

outline:none;

resize:none;

padding:20px;

font-size:18px;

line-height:2;

color:#111827;

background:#fff;

}


textarea:focus{

background:#fffdf5;

}



/* ================= STATS ================= */


.statsBar{

height:75px;

background:white;

border-top:1px solid var(--border);

display:grid;

grid-template-columns:repeat(7,1fr);

}



.stat{

display:flex;

align-items:center;

justify-content:center;

flex-direction:column;

border-right:1px solid var(--border);

}



.stat:last-child{

border:none;

}



.stat h2{

font-size:22px;

}



.stat span{

font-size:11px;

color:var(--muted);

}



/* ================= BUTTON AREA ================= */


.bottomBar{

height:65px;

background:white;

display:flex;

justify-content:flex-end;

align-items:center;

gap:15px;

padding:0 20px;

border-top:1px solid var(--border);

}



button{

padding:12px 25px;

border:none;

border-radius:8px;

font-size:15px;

font-weight:600;

cursor:pointer;

transition:.3s;

}



button:hover{

transform:translateY(-2px);

}



#submitBtn{

background:#16a34a;

color:white;

}



#resetBtn{

background:#dc2626;

color:white;

}



/* ================= SCROLL ================= */


::-webkit-scrollbar{

width:8px;

}



::-webkit-scrollbar-thumb{

background:#cbd5e1;

border-radius:20px;

}



/* ================= MOBILE ================= */


@media(max-width:900px){


header{

padding:0 12px;

}


.examInfo{

gap:10px;

}


.main{

height:auto;

overflow:auto;

}


.statsBar{

grid-template-columns:repeat(3,1fr);

height:auto;

}


.stat{

padding:10px;

}


}



</style>

</head>


<body>


<header>


<div class="logo">

<div class="logo-icon">
⌨️
</div>


<div>

<h2>
Typing Examination
</h2>


<p id="examName">
Loading Examination...
</p>


</div>

</div>



<div class="examInfo">


<div class="infoBox">

<h3 id="timer">
00:00
</h3>

<span>
TIME LEFT
</span>

</div>



<div class="infoBox">

<h3 id="candidate">
Candidate
</h3>

<span>
USER
</span>

</div>



</div>


</header>





<div class="main">


<!-- PASSAGE PANEL -->


<div class="panel">


<div class="panelHeader">

<span>
Question Passage
</span>


<span id="wordCountLabel">
0 Words
</span>


</div>



<div class="passageArea">


<div id="originalText">

Loading passage...

</div>


</div>


</div>





<!-- TYPING PANEL -->


<div class="panel">


<div class="panelHeader">


<span>
Your Typing
</span>


<span id="typedChars">
0 Characters
</span>


</div>



<div class="typingBox">


<textarea

id="typingArea"

spellcheck="false"

autocomplete="off"

autocorrect="off"

autocapitalize="off"

placeholder="Start typing here..."

></textarea>


</div>


</div>


</div>





<div class="statsBar">


<div class="stat">

<h2 id="grossWPM">
0
</h2>

<span>
Gross WPM
</span>

</div>



<div class="stat">

<h2 id="netWPM">
0
</h2>

<span>
Net WPM
</span>

</div>



<div class="stat">

<h2 id="accuracy">
100%
</h2>

<span>
Accuracy
</span>

</div>



<div class="stat">

<h2 id="errors">
0
</h2>

<span>
Errors
</span>

</div>



<div class="stat">

<h2 id="keystrokes">
0
</h2>

<span>
Keystrokes
</span>

</div>



<div class="stat">

<h2 id="wordsTyped">
0
</h2>

<span>
Words
</span>

</div>



<div class="stat">

<h2 id="progress">
0%
</h2>

<span>
Completed
</span>

</div>


</div>





<div class="bottomBar">


<button id="resetBtn">
Reset Test
</button>


<button id="submitBtn">
Submit Test
</button>


</div>
<script>


/* ==============================
   LOAD SELECTED PASSAGE
============================== */


const passageData =
JSON.parse(
localStorage.getItem("selectedPassage")
);


const examName =
localStorage.getItem("selectedExam")
||
"Typing Examination";


const duration =
parseInt(
localStorage.getItem("selectedDuration")
)
||
10;



if(!passageData){

alert(
"No passage selected."
);

location.href="index.html";

}



const originalText =
passageData.text;



document.getElementById("examName").textContent =
examName;



document.getElementById("candidate").textContent =
"Candidate";



document.getElementById("originalText").textContent =
originalText;



document.getElementById("wordCountLabel").textContent =

originalText
.trim()
.split(/\s+/)
.length
+
" Words";





/* ==============================
 VARIABLES
============================== */


const input =
document.getElementById("typingArea");


let totalSeconds =
duration * 60;


let timerInterval;


let started=false;


let keystrokes=0;


let errors=0;


let correctChars=0;


let typedText="";





/* ==============================
 TIMER
============================== */


document.getElementById("timer").textContent =

String(duration).padStart(2,"0")
+
":00";




function startTimer(){


timerInterval =
setInterval(()=>{


if(totalSeconds<=0){


clearInterval(timerInterval);


submitTest();


return;


}



totalSeconds--;



let min =
Math.floor(totalSeconds/60);



let sec =
totalSeconds%60;



document.getElementById("timer").textContent =

String(min).padStart(2,"0")
+
":"
+
String(sec).padStart(2,"0");



},1000);


}





/* ==============================
 TYPING CHECK ENGINE
============================== */


function calculateTyping(){



typedText =
input.value;



errors=0;


correctChars=0;



for(
let i=0;
i<typedText.length;
i++
){


if(
typedText[i]
===
originalText[i]
){


correctChars++;


}
else{


errors++;


}


}





updateStats();



}





/* ==============================
 AUTO PASSAGE SCROLL
============================== */


function scrollPassage(){


let ratio =

input.value.length
/
originalText.length;



let passageBox =
document.querySelector(".passageArea");



passageBox.scrollTop =

passageBox.scrollHeight
*
ratio;



}







/* ==============================
 INPUT EVENT
============================== */


input.addEventListener(
"input",
()=>{



if(!started){


started=true;


startTimer();


}



calculateTyping();


scrollPassage();



}

);







/* ==============================
 STATISTICS
============================== */


function updateStats(){



keystrokes =
input.value.length;



let elapsed =

(duration*60-totalSeconds)/60;



if(elapsed<=0){

elapsed=1/60;

}





let gross =

(keystrokes/5)
/elapsed;



let net =

(correctChars/5)
/elapsed;



if(net<0){

net=0;

}




let accuracy=0;



if(keystrokes>0){


accuracy =

(correctChars/keystrokes)
*
100;


}





let words =

input.value.trim();



if(words===""){

words=0;

}
else{


words =
input.value
.trim()
.split(/\s+/)
.length;


}






let progress =

(input.value.length
/
originalText.length)
*
100;



if(progress>100){

progress=100;

}






document.getElementById("grossWPM").textContent =

gross.toFixed(0);




document.getElementById("netWPM").textContent =

net.toFixed(0);




document.getElementById("accuracy").textContent =

accuracy.toFixed(1)
+
"%";




document.getElementById("errors").textContent =

errors;




document.getElementById("keystrokes").textContent =

keystrokes;




document.getElementById("wordsTyped").textContent =

words;




document.getElementById("typedChars").textContent =

keystrokes
+
" Characters";




document.getElementById("progress").textContent =

progress.toFixed(0)
+
"%";



}







/* ==============================
 INITIAL FOCUS
============================== */


window.onload=function(){


input.focus();


};





window.onclick=function(){


input.focus();


};






/* ==============================
   SUBMIT TEST
============================== */


function submitTest(){


clearInterval(timerInterval);



let elapsed =

(duration*60-totalSeconds)/60;



if(elapsed<=0){

elapsed=1/60;

}



let gross =

(keystrokes/5)
/elapsed;



let net =

(correctChars/5)
/elapsed;



if(net<0){

net=0;

}



let accuracy=0;



if(keystrokes>0){


accuracy =

(correctChars/keystrokes)
*
100;


}





const result={


exam:examName,


title:passageData.title,


duration:duration,


original:originalText,


typed:typedText,


grossWPM:gross.toFixed(2),


netWPM:net.toFixed(2),


accuracy:accuracy.toFixed(2),


errors:errors,


keystrokes:keystrokes,


wordsTyped:
input.value.trim()===""
?
0
:
input.value.trim().split(/\s+/).length,



completed:

new Date().toLocaleString()



};





localStorage.setItem(

"typingResult",

JSON.stringify(result)

);




alert(

"Typing Test Completed\n\n"+
"Gross WPM : "+gross.toFixed(0)+
"\nNet WPM : "+net.toFixed(0)+
"\nAccuracy : "+accuracy.toFixed(1)+"%"

);




location.href="results.html";



}







/* ==============================
 SUBMIT BUTTON
============================== */


document

.getElementById("submitBtn")

.addEventListener(

"click",

()=>{


if(
confirm(
"Submit your typing test?"
)

){


submitTest();


}


}

);







/* ==============================
 RESET BUTTON
============================== */


document

.getElementById("resetBtn")

.addEventListener(

"click",

()=>{


if(
confirm(
"Reset current examination?"
)

){


clearInterval(timerInterval);


input.value="";


totalSeconds=duration*60;


started=false;


keystrokes=0;


errors=0;


correctChars=0;


typedText="";


updateStats();



document.getElementById("timer").textContent =

String(duration).padStart(2,"0")
+
":00";



}



}

);







/* ==============================
 FULLSCREEN MODE
============================== */


async function enterFullscreen(){


try{


await document.documentElement.requestFullscreen();


}

catch(e){}



}



enterFullscreen();







/* ==============================
 PREVENT COPYING
============================== */


document.addEventListener(

"contextmenu",

e=>{

e.preventDefault();

}

);




document.addEventListener(

"copy",

e=>{

e.preventDefault();

}

);



document.addEventListener(

"cut",

e=>{

e.preventDefault();

}

);



document.addEventListener(

"paste",

e=>{

e.preventDefault();

}

);







/* ==============================
 KEYBOARD SECURITY
============================== */


document.addEventListener(

"keydown",

e=>{


if(e.ctrlKey){

e.preventDefault();

}



if(e.key==="F12"){

e.preventDefault();

}



if(e.key==="Tab"){

e.preventDefault();

}



if(
e.altKey ||
e.metaKey
){

e.preventDefault();

}



}

);







/* ==============================
 TAB SWITCH DETECTION
============================== */


let examActive=true;



document.addEventListener(

"visibilitychange",

()=>{


if(
document.hidden &&
examActive
){


alert(

"Warning: Do not leave the examination window."

);


}


}

);







/* ==============================
 AUTO SAVE DRAFT
============================== */


setInterval(

()=>{


localStorage.setItem(

"typingDraft",

input.value

);



},

1000

);







/* ==============================
 RESTORE DRAFT
============================== */


let savedDraft =

localStorage.getItem(
"typingDraft"
);



if(savedDraft){


input.value=savedDraft;


calculateTyping();


}







/* ==============================
 TITLE PROGRESS
============================== */


setInterval(

()=>{


document.title =

"Typing Test - "
+
document.getElementById("progress").textContent;



},

1000

);







/* ==============================
 KEEP FOCUS
============================== */


setInterval(

()=>{


if(started){

input.focus();

}


},

2000

);




/* ==============================
 FINAL PERFORMANCE CLEANUP
============================== */


// Remove old draft after successful submission

function clearTypingDraft(){

localStorage.removeItem(
"typingDraft"
);

}





// Stop all exam activity

function stopExam(){

examActive=false;

clearInterval(timerInterval);

clearTypingDraft();

}






/* ==============================
 UPDATE SUBMIT FUNCTION HOOK
============================== */


const oldSubmitTest = submitTest;


submitTest=function(){


stopExam();


oldSubmitTest();


};







/* ==============================
 CHARACTER REMAINING INDICATOR
============================== */


setInterval(()=>{


let remaining =

originalText.length -
input.value.length;



if(remaining<0){

remaining=0;

}



document.getElementById("typedChars").textContent =

input.value.length
+
" Characters";



},500);







/* ==============================
 PREVENT TEXT SELECTION
============================== */


document
.getElementById("originalText")
.style.userSelect="none";







/* ==============================
 INITIAL STAT LOAD
============================== */


updateStats();







/* ==============================
 END OF APPLICATION
============================== */


</script>


</body>

</html>
