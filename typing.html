<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>Typing Examination</title>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">


<style>


*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:'Poppins',sans-serif;

}



:root{


--primary:#2563eb;

--dark:#0f172a;

--bg:#eef2f7;

--card:#ffffff;

--border:#dbe4ef;

--text:#1e293b;

--muted:#64748b;

--success:#16a34a;

--danger:#dc2626;


}





body{


height:100vh;


overflow:hidden;


background:var(--bg);


color:var(--text);


}






/* ================= HEADER ================= */



header{


height:70px;


background:linear-gradient(

135deg,

#2563eb,

#0f172a

);


color:white;


display:flex;


align-items:center;


justify-content:space-between;


padding:0 22px;


box-shadow:

0 5px 20px rgba(0,0,0,.25);


}





.logo{


display:flex;


align-items:center;


gap:14px;


}





.logo-icon{


font-size:38px;


}





.logo h2{


font-size:22px;


}





.logo p{


font-size:12px;


opacity:.8;


}






.header-right{


display:flex;


align-items:center;


gap:25px;


}





.info{


text-align:center;


}





.info h3{


font-size:24px;


}





.info span{


font-size:11px;


opacity:.8;


}






#timer{


color:#fde047;


letter-spacing:2px;


}





#fullscreenBtn{


background:#ffffff;


color:#1e3a8a;


padding:10px 18px;


border-radius:8px;


font-weight:600;


border:none;


cursor:pointer;


}




/* ================= MAIN ================= */



.exam-area{


height:calc(100vh - 140px);


padding:12px;


display:grid;


grid-template-rows:45% 55%;


gap:12px;


}







.panel{


background:white;


border-radius:14px;


border:1px solid var(--border);


overflow:hidden;


display:flex;


flex-direction:column;


box-shadow:

0 5px 18px rgba(0,0,0,.06);


}





.panel-title{


height:48px;


background:#f8fafc;


border-bottom:1px solid var(--border);


display:flex;


align-items:center;


justify-content:space-between;


padding:0 20px;


font-weight:600;


}





.panel-title span:last-child{


font-size:12px;


color:var(--muted);


}





/* ================= PASSAGE ================= */



.passage-container{


flex:1;


overflow-y:auto;


padding:22px;


}





#originalText{


font-size:18px;


line-height:2.1;


white-space:pre-wrap;


word-break:break-word;


color:#334155;


}






/* ================= TYPING ================= */



.typing-container{


flex:1;


}





#typingArea{


width:100%;


height:100%;


resize:none;


border:none;


outline:none;


padding:22px;


font-size:18px;


line-height:2.1;


color:#111827;


}





#typingArea:focus{


background:#fffdf5;


}






/* ================= FOOTER ================= */



.footer{


height:70px;


background:white;


border-top:1px solid var(--border);


display:flex;


justify-content:flex-end;


align-items:center;


gap:15px;


padding:0 25px;


}




button{


border:none;


cursor:pointer;


font-weight:600;


font-size:15px;


padding:12px 26px;


border-radius:8px;


transition:.3s;


}




button:hover{


transform:translateY(-2px);


}




#resetBtn{


background:#dc2626;


color:white;


}




#submitBtn{


background:#16a34a;


color:white;


}






/* ================= SCROLL ================= */



::-webkit-scrollbar{


width:8px;


}



::-webkit-scrollbar-thumb{


background:#cbd5e1;


border-radius:20px;


}






/* ================= MOBILE ================= */



@media(max-width:900px){



.header-right{


gap:10px;


}



.exam-area{


grid-template-rows:40% 60%;


}


}






</style>


</head>


<body>






<header>


<div class="logo">


<div class="logo-icon">
⌨️
</div>


<div>


<h2>
Typing Examination
</h2>


<p id="examName">
Loading Examination...
</p>


</div>


</div>







<div class="header-right">


<div class="info">


<h3 id="timer">
00:00
</h3>


<span>
TIME REMAINING
</span>


</div>





<div class="info">


<h3 id="candidate">
Candidate
</h3>


<span>
USER
</span>


</div>





<button id="fullscreenBtn">


⛶ Full Screen


</button>





</div>


</header>








<div class="exam-area">





<!-- PASSAGE -->

<div class="panel">


<div class="panel-title">


<span>
Question Passage
</span>


<span>
Manual Scroll
</span>


</div>



<div class="passage-container">


<div id="originalText">

Loading Passage...

</div>


</div>


</div>








<!-- TYPING -->

<div class="panel">


<div class="panel-title">


<span>
Typing Area
</span>


<span>
Start From Beginning
</span>


</div>



<div class="typing-container">


<textarea

id="typingArea"

spellcheck="false"

autocomplete="off"

autocorrect="off"

autocapitalize="off"

placeholder="Type the passage here..."

></textarea>


</div>


</div>





</div>







<div class="footer">


<button id="resetBtn">

Reset Test

</button>



<button id="submitBtn">

Submit Test

</button>



</div>
<script>


/* ======================================
   LOAD SELECTED EXAM DATA
====================================== */


const passageData =

JSON.parse(

localStorage.getItem("selectedPassage")

);



const examName =

localStorage.getItem("selectedExam")

||

"Typing Examination";



const duration =

parseInt(

localStorage.getItem("selectedDuration")

)

||

10;





if(!passageData){


alert(

"No passage selected."

);


location.href="index.html";


}





const originalText =

passageData.text;






document.getElementById("examName").textContent =

examName;





document.getElementById("originalText").textContent =

originalText;






/* ======================================
   CLEAN START EVERY TIME
====================================== */


const typingArea =

document.getElementById("typingArea");



// Always empty when new exam starts

typingArea.value="";



// Remove any previous temporary text

localStorage.removeItem(

"typingDraft"

);







/* ======================================
   TIMER VARIABLES
====================================== */


let totalSeconds =

duration * 60;



let timerInterval = null;



let started=false;



let examFinished=false;



let typedText="";






document.getElementById("timer").textContent =

String(duration).padStart(2,"0")

+

":00";








/* ======================================
   START TIMER
====================================== */


function startTimer(){


timerInterval = setInterval(()=>{


if(totalSeconds<=0){


clearInterval(timerInterval);


submitTest();


return;


}



totalSeconds--;



let min =

Math.floor(totalSeconds/60);



let sec =

totalSeconds%60;




document.getElementById("timer").textContent =

String(min).padStart(2,"0")

+

":"

+

String(sec).padStart(2,"0");




},1000);



}









/* ======================================
   TYPING START
====================================== */


typingArea.addEventListener(

"input",

function(){



if(!started){


started=true;


startTimer();


}



typedText=this.value;



}

);









/* ======================================
   FULLSCREEN BUTTON
====================================== */


const fullscreenBtn =

document.getElementById("fullscreenBtn");





fullscreenBtn.addEventListener(

"click",

async function(){



try{



if(!document.fullscreenElement){



await document.documentElement.requestFullscreen();



fullscreenBtn.textContent=

"⛶ Exit Full Screen";



}

else{



await document.exitFullscreen();



fullscreenBtn.textContent=

"⛶ Full Screen";


}



}

catch(e){



alert(

"Fullscreen mode not supported."

);


}



}

);









/* ======================================
   AUTO UPDATE BUTTON TEXT
====================================== */


document.addEventListener(

"fullscreenchange",

function(){



if(!document.fullscreenElement){



fullscreenBtn.textContent=

"⛶ Full Screen";


}



}

);









/* ======================================
   FOCUS CONTROL
====================================== */


window.onload=function(){


typingArea.focus();


};





window.onclick=function(){


typingArea.focus();


};









/* ======================================
   SECURITY
====================================== */



document.addEventListener(

"contextmenu",

e=>{

e.preventDefault();

}

);





document.addEventListener(

"copy",

e=>{

e.preventDefault();

}

);





document.addEventListener(

"cut",

e=>{

e.preventDefault();

}

);





document.addEventListener(

"paste",

e=>{

e.preventDefault();

}

);






document.addEventListener(

"keydown",

function(e){



if(

e.ctrlKey ||

e.altKey ||

e.metaKey

){


e.preventDefault();


}



if(

e.key==="F12"

){


e.preventDefault();


}



if(

e.key==="Tab"

){


e.preventDefault();


}



}

);





 

/* ======================================
   SUBMIT EXAM
====================================== */


function submitTest(){


if(examFinished){

return;

}



examFinished=true;



clearInterval(timerInterval);





const result = {


exam:

examName,



title:

passageData.title,



duration:

duration,



passage:

originalText,



typed:

typingArea.value,



submittedTime:

new Date().toLocaleString()



};





// Store final answer

localStorage.setItem(

"typingResult",

JSON.stringify(result)

);





// Remove temporary data

localStorage.removeItem(

"typingDraft"

);






location.href=

"results.html";



}









/* ======================================
   SUBMIT BUTTON
====================================== */


document

.getElementById("submitBtn")

.addEventListener(

"click",

function(){



if(

confirm(

"Submit your typing examination?"

)

){



submitTest();



}



}

);











/* ======================================
   RESET TEST
====================================== */


document

.getElementById("resetBtn")

.addEventListener(

"click",

function(){



let choice =

confirm(

"Reset this examination and start again?"

);





if(choice){



clearInterval(timerInterval);



typingArea.value="";



typedText="";



started=false;



totalSeconds=

duration*60;



document.getElementById("timer").textContent=

String(duration).padStart(2,"0")

+

":00";





localStorage.removeItem(

"typingDraft"

);





typingArea.focus();



}



}

);









/* ======================================
   PREVENT ACCIDENTAL CLOSE
====================================== */


window.onbeforeunload=function(){



if(

started &&

!examFinished

){


return "Examination is running.";


}



};











/* ======================================
   TAB CHANGE WARNING
====================================== */


document.addEventListener(

"visibilitychange",

function(){



if(

document.hidden &&

started &&

!examFinished

){



alert(

"Please stay on the examination screen."

);



}



}

);











/* ======================================
   LOCK AFTER SUBMISSION
====================================== */


function finishExam(){


examFinished=true;



typingArea.disabled=true;



clearInterval(timerInterval);



}

 

/* ======================================
   FINAL CLEANUP
====================================== */



// Remove any leftover temporary typing data

function clearTemporaryData(){


localStorage.removeItem(

"typingDraft"

);


}






// Keep browser title professional

setInterval(()=>{


if(!examFinished){



document.title =

"Typing Examination | "

+

document.getElementById("timer").textContent;



}



},1000);








/* ======================================
   INITIAL SETTINGS
====================================== */



typingArea.focus();



// Ensure no old answer remains

typingArea.value="";




// Remove previous unfinished attempt

clearTemporaryData();







/* ======================================
   FINAL READY STATE
====================================== */


console.log(

"Typing Examination Loaded Successfully"

);



</script>



</body>


</html>
