linear-gradient(

<body>


<div class="login" id="loginScreen">

<div class="login-box">

<h2>
🔐 Admin Login
</h2>


<p style="margin-bottom:20px;color:#64748b">

TypingMaster Pro Administration

</p>

type="password"
id="adminPin"
placeholder="Enter Admin PIN">


<br><br>

onclick="login()">

</div>

</div>



<header>

<div class="logo">

<div class="logo-icon">
⌨️
</div>


<div>

<h1>
TypingMaster Pro
</h1>


<span>
Offline Passage Management System
</span>

</div>


</div>


<div class="admin-info">

<div class="admin-badge">

ADMIN PANEL

</div>

</div>


</header>



<div class="container">


<div class="card">


<div class="card-title">

</div>

</label>

id="title"
placeholder="Example: Indian History">


<label>
Exam Category
</label>


<select id="exam">

<option> DP HCM </option>
    
<option>SSC CGL DEST</option>

</label>

id="text"
placeholder="Write or paste typing passage here..."></textarea>

onclick="savePassage()">

Save Passage Offline

</button>


</div>

<div class="stat">

0
</h2>

Total Passages
</p>

</div>

0
</h2>

</p>

</div>

0 KB
</h2>

</p>

</div>

<span>
Stored Examination Passages
</span>

</div>

id="search"

Export

padding:12px 18px;

<table>


<thead>

<tr>

<th>
No.
</th>


<th>

</th>


<th>
Exam
</th>


<th>

</th>


<th>
Words
</th>


<th>

</th>

</tr>

</tbody>

class="preview"
id="preview">

Select a passage to view preview.

</div>

<script>


const ADMIN_PASSWORD="12345";


let passages=
JSON.parse(
localStorage.getItem("typing_passages")
)
||[];



function login(){


let pin=
document.getElementById("adminPin").value;



if(pin===ADMIN_PASSWORD){


document.getElementById("loginScreen")
.style.display="none";


localStorage.setItem(
"adminLogin",
"true"
);


}
else{


alert(
"Incorrect Admin PIN"
);


}


}



if(
localStorage.getItem("adminLogin")
==="true"
){

document.getElementById("loginScreen")
.style.display="none";

}



function saveData(){


localStorage.setItem(
"typing_passages",
JSON.stringify(passages)
);


}




function savePassage(){



let title=
document.getElementById("title")
.value.trim();


let exam=
document.getElementById("exam")
.value;



let difficulty=
document.getElementById("difficulty")
.value;



let duration=
document.getElementById("testDuration")
.value;



let text=
document.getElementById("text")
.value.trim();



if(
title==="" ||
text===""
){


alert(
"Please enter title and passage text"
);


return;


}



let obj={



id:
Date.now(),


title:title,


exam:exam,


difficulty:difficulty,


duration:duration,


text:text,


words:
text.split(/\s+/).length,


created:
new Date()
.toLocaleString()



};



passages.push(obj);


saveData();


render();


alert(
"Passage saved successfully offline"
);



document.getElementById("title")
.value="";


document.getElementById("text")
.value="";



}




document
.getElementById("fileUpload")
.addEventListener(
"change",
function(e){



let file=e.target.files[0];



if(!file)
return;



if(
file.type==="text/plain"
||
file.name.endsWith(".txt")
){


let reader=
new FileReader();


reader.onload=function(){

document.getElementById("text")
.value=
reader.result;


};


reader.readAsText(file);



}


else if(file.name.endsWith(".pdf")){

extractPDF(file);

}


else{


alert(
"Only TXT and PDF files are allowed."
);


}


});





async function extractPDF(file){

try{

let arrayBuffer = await file.arrayBuffer();

let pdf = await pdfjsLib.getDocument({
    data: arrayBuffer
}).promise;


let text = "";


for(let pageNumber=1; pageNumber<=pdf.numPages; pageNumber++){

let page = await pdf.getPage(pageNumber);

let content = await page.getTextContent();


content.items.forEach(item=>{

text += item.str + " ";

});

}


if(text.trim()===""){

alert(
"Unable to extract text. This PDF may be scanned image based."
);

return;

}


document.getElementById("text").value=text.trim();


alert(
"PDF text extracted successfully. Review and save."
);


}
catch(error){

console.error(error);

alert(
"PDF extraction failed."
);

}

}




function render(){


let table=
document.getElementById("passageTable");



table.innerHTML="";



let totalWords=0;



passages.forEach(
(p,index)=>{


totalWords+=p.words;



table.innerHTML+=`


<tr
onclick="preview(${p.id})"
>


<td>
${index+1}
</td>


<td>

${p.title}

</td>


<td>

<span class="badge">

${p.exam}

</span>

</td>


<td>

${p.difficulty}

</td>


<td>

${p.words}

</td>


<td>


<div class="action">


<button

class="primary small"

onclick="event.stopPropagation();editPassage(${p.id})"

>

Edit

</button>



<button

class="danger small"

onclick="event.stopPropagation();deletePassage(${p.id})"

>

Delete

</button>


</div>


</td>


</tr>



`;



}

);



document
.getElementById("total")
.innerHTML=
passages.length;



document
.getElementById("words")
.innerHTML=
totalWords;



let size=
new Blob(
[
JSON.stringify(passages)
]
).size;



document
.getElementById("storage")
.innerHTML=
(size/1024).toFixed(2)
+
" KB";



}



function preview(id){



let p=
passages.find(
x=>x.id===id
);



if(!p)
return;



document
.getElementById("preview")
.innerHTML=

`

<h3>
${p.title}
</h3>

<br>

<b>
Exam:
</b>
${p.exam}

<br>

<b>
Difficulty:
</b>
${p.difficulty}

<br><br>

${p.text}

`;



}




function deletePassage(id){



if(
!confirm(
"Delete this passage?"
)
)
return;



passages=
passages.filter(
x=>x.id!==id
);



saveData();


render();



}




function editPassage(id){



let p=
passages.find(
x=>x.id===id
);



if(!p)
return;



document
.getElementById("title")
.value=p.title;



document
.getElementById("exam")
.value=p.exam;



document
.getElementById("difficulty")
.value=p.difficulty;



document
.getElementById("testDuration")
.value=p.duration;



document
.getElementById("text")
.value=p.text;



passages=
passages.filter(
x=>x.id!==id
);



saveData();


render();



window.scrollTo({

top:0,

behavior:"smooth"

});



}





document
.getElementById("search")
.addEventListener(
"keyup",
function(){


let key=
this.value.toLowerCase();



document
.querySelectorAll(
"#passageTable tr"
)
.forEach(
row=>{


row.style.display=

row.innerText
.toLowerCase()
.includes(key)

?

""

:

"none";



}

);



});



function exportBackup(){



let blob=
new Blob(
[
JSON.stringify(
passages,
null,
2
)
],
{
type:"application/json"
}
);



let a=
document.createElement("a");



a.href=
URL.createObjectURL(blob);



a.download=
"typing_passages_backup.json";



a.click();



}



function importBackup(e){



let file=
e.target.files[0];



if(!file)
return;



let reader=
new FileReader();



reader.onload=function(){



try{


let data=
JSON.parse(
reader.result
);



if(
Array.isArray(data)
){


passages=data;


saveData();


render();


alert(
"Backup restored successfully"
);


}



}
catch{


alert(
"Invalid backup file"
);


}



};



reader.readAsText(file);



}



render();



</script>

<!-- PART 3 : ADVANCED ADMIN FEATURES -->

<script>

/*
=================================================
ADVANCED OFFLINE DATABASE ENGINE
IndexedDB Backup Layer
=================================================
*/


let db;


const request =
indexedDB.open(
"TypingMasterDatabase",
1
);



request.onupgradeneeded=function(e){


db=
e.target.result;



if(
!db.objectStoreNames.contains("passages")
){


db.createObjectStore(
"passages",
{
keyPath:"id"
}

);


}


};



request.onsuccess=function(e){


db=e.target.result;


syncIndexedDB();



};



request.onerror=function(){


console.log(
"IndexedDB unavailable"
);


};





function syncIndexedDB(){



if(!db)
return;



let transaction=
db.transaction(
["passages"],
"readwrite"
);



let store=
transaction.objectStore(
"passages"
);



store.clear();



passages.forEach(
item=>{


store.add(item);


}

);



}





/*
=================================================
LOAD FROM INDEXED DATABASE
=================================================
*/


function loadIndexedDB(){


if(!db)
return;



let transaction=
db.transaction(
["passages"],
"readonly"
);



let store=
transaction.objectStore(
"passages"
);



let request=
store.getAll();



request.onsuccess=function(){



if(
request.result.length>0
){


passages=
request.result;



localStorage.setItem(
"typing_passages",
JSON.stringify(passages)
);



render();



}



};


}






/*
=================================================
MULTIPLE FILE UPLOAD SUPPORT
=================================================
*/


function processMultipleFiles(files){



Array.from(files)
.forEach(
file=>{


if(
file.name.endsWith(".txt")
){


let reader=
new FileReader();



reader.onload=function(){


createFilePassage(
file.name,
reader.result
);


};



reader.readAsText(file);



}



else if(
file.name.endsWith(".pdf")
){


extractPDF(file);



}



}

);



}






function createFilePassage(
filename,
content
){



let title=
filename
.replace(
".txt",
""
);



let obj={


id:Date.now()+Math.random(),


title:title,


exam:"Custom Examination",


difficulty:"Medium",


duration:"10",


text:content,


words:
content
.trim()
.split(/\s+/)
.length,


created:
new Date()
.toLocaleString()


};



passages.push(obj);



saveData();



syncIndexedDB();



render();



}






/*
=================================================
PDF IMPORT ENGINE
=================================================

Uses PDF.js compatible extraction.

If pdf.js is included,
it extracts all pages automatically.

=================================================
*/


async function extractPDF(file){



try{


let arrayBuffer=
await file.arrayBuffer();



let pdf=
await pdfjsLib
.getDocument(
{
data:arrayBuffer
}
)
.promise;



let text="";



for(
let i=1;
i<=pdf.numPages;
i++
){


let page=
await pdf.getPage(i);



let content=
await page.getTextContent();



content.items
.forEach(
item=>{


text+=
item.str+" ";



});


}



createFilePassage(
file.name,
text
);



alert(
"PDF imported successfully"
);



}

catch(e){


alert(
"PDF extraction failed. Use text based PDF."
);



}



}






/*
=================================================
PASSAGE DUPLICATE CHECK
=================================================
*/


function checkDuplicate(text){


return passages.some(
p=>

p.text.trim()
===
text.trim()

);


}




/*
=================================================
AUTOMATIC PASSAGE NUMBERING
=================================================
*/


function getPassageNumber(id){


let index=
passages.findIndex(
p=>p.id===id
);


return index+1;


}





/*
=================================================
EXAM MANAGEMENT
=================================================
*/


function getExamList(){



let exams=[];



passages.forEach(
p=>{


if(
!exams.includes(p.exam)
){


exams.push(p.exam);


}


});



return exams;



}




function filterByExam(exam){



return passages.filter(
p=>

p.exam===exam

);



}






/*
=================================================
STATISTICS DASHBOARD
=================================================
*/


function getStatistics(){



let total=
passages.length;



let chars=0;


passages.forEach(
p=>{


chars+=
p.text.length;


});



return {


passages:total,


characters:chars,


words:
passages.reduce(
(a,b)=>
a+b.words,
0
)


};



}





/*
=================================================
AUTO SAVE SYSTEM
=================================================
*/


setInterval(
function(){


saveData();



syncIndexedDB();



},
10000
);







/*
=================================================
SECURITY FEATURES
=================================================
*/


document.addEventListener(
"keydown",
function(e){



if(
e.ctrlKey &&
(
e.key==="u" ||
e.key==="s"
)
){


e.preventDefault();


}



});







/*
=================================================
ADMIN SESSION TIMER
=================================================
*/


let adminTime=0;



setInterval(
function(){



adminTime++;



if(
adminTime>3600
){


localStorage.removeItem(
"adminLogin"
);



alert(
"Admin session expired"
);



location.reload();



}



},
1000
);






/*
=================================================
DARK MODE ADMIN SUPPORT
=================================================
*/


function adminDarkMode(){


document.body.classList.toggle(
"dark"
);



}





</script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
